logging:
  level: "INFO"
  console_output: true
  file: "logs/audio2mbti.log"
  max_file_size: 10485760
  backup_count: 5

data:
  batch_size: 25

validation:
  allowed_mbti_labels: ["ESTJ", "ENTJ", "ESFJ", "ENFJ", "ESTP", "ENTP", "ESFP", "ENFP", "ISTJ", "INTJ", "ISFJ", "INFJ", "ISTP", "INTP", "ISFP", "INFP"]
  required_columns: ["title", "artists", "artist_genres"]

monitoring:
  metrics_file: "logs/metrics.json"

parallel:
  num_workers: 4
  use_multiprocessing: true
  chunk_size: 10

retry:
  max_retries: 3
  backoff_factor: 2.0
  status_forcelist: [500, 502, 503, 504]

rate_limiting:
  spotify:
    requests_per_second: 1.0
  youtube:
    requests_per_second: 1.0
  apple_music:
    requests_per_second: 1.0

apis:
  spotify:
    timeout: 10
  youtube:
    timeout: 10
  apple_music:
    timeout: 10

paths:
  csv_backup_dir: "./data/backups"
